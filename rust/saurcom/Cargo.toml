[package]
name = "saurcom"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Eye of SaurCom Rust code as ONE static library (libsaurcom_rs.a): re-exports every module's extern \"C\" functions"

[lib]
name = "saurcom_rs"
crate-type = ["staticlib", "rlib"]

[features]
bare = []

