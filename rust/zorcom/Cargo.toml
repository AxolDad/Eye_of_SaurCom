[package]
name = "zorcom"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Eye of ZorCom Rust code as ONE static library (libzorcom_rs.a): re-exports every module's extern \"C\" functions"

[lib]
name = "zorcom_rs"
crate-type = ["staticlib", "rlib"]

[features]
bare = []

[dependencies]
zorcom_common = { path = "../zorcom_common" }
zorcom_proto = { path = "../zorcom_proto" }
