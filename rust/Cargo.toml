[workspace]
resolver = "2"
members = [
    "zorcom_common", "zorcom_proto", "zorcom",
    "zorcom_adsb", "zorcom_acars", "zorcom_same", "zorcom_pager", "zorcom_ax25", "zorcom_dmr", "zorcom_p25", "zorcom_nxdn",
    "zorcom_dstar", "zorcom_tetra", "zorcom_vdl2", "zorcom_hfdl", "zorcom_mesh", "zorcom_wisun", "zorcom_uat",
    "zorcom_ts", "zorcom_dvbsi", "zorcom_dab", "zorcom_drm", "zorcom_files", "zorcom_net", "zorcom_engine", "zorcom_fec", "zorcom_usb", "zorcom_ring", "zorcom_kris", "zorcom_kaws", "zorcom_cot", "zorcom_wifisense", "zorcom_dsn",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
publish = false

# One set of profiles for everything (profiles are only read from the workspace root). panic=abort: nothing may unwind across the C boundary.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "abort"
