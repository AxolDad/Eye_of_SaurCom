[workspace]
resolver = "2"
members = [
    "saurcom_common", "saurcom_proto", "saurcom",
    "saurcom_adsb", "saurcom_acars", "saurcom_same", "saurcom_pager", "saurcom_ax25", "saurcom_dmr", "saurcom_p25", "saurcom_nxdn",
    "saurcom_dstar", "saurcom_tetra", "saurcom_vdl2", "saurcom_hfdl", "saurcom_mesh", "saurcom_wisun", "saurcom_uat",
    "saurcom_ts", "saurcom_dvbsi", "saurcom_dab", "saurcom_drm", "saurcom_files", "saurcom_net", "saurcom_engine", "saurcom_fec", "saurcom_usb", "saurcom_ring", "saurcom_kris", "saurcom_kaws", "saurcom_cot", "saurcom_wifisense", "saurcom_dsn",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
publish = false

# One set of profiles for everything (profiles are only read from the workspace root). panic=abort: nothing may unwind across the C boundary.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "abort"
